[build]
  # El lint corre en cada deploy: si falla, Netlify no publica y sigue el deploy anterior.
  command = "npm run lint && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Encabezados de seguridad para todo el sitio.
# La CSP permite Supabase (API y realtime), Google Fonts y las fotos del bucket
# público; todo lo demás queda restringido al propio dominio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; upgrade-insecure-requests"

# Los archivos con hash de Vite no cambian nunca: se pueden cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
